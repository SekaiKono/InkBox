      const exportPdfBtn = document.getElementById('export-pdf-btn');
      const exportPngBtn = document.getElementById('export-png-btn');

      const settingsBtn = document.getElementById('settings-btn');
      const settingsDropdown = document.getElementById('settingsDropdown');
      const layoutHorizontalBtn = document.getElementById('layout-horizontal');
      const layoutVerticalBtn = document.getElementById('layout-vertical');
      const checkHorizontal = document.getElementById('check-horizontal');
      const checkVertical = document.getElementById('check-vertical');
      const toggleWrapBtn = document.getElementById('toggle-wrap');
      const checkWrap = document.getElementById('check-wrap');
      const swapBtn = document.getElementById('swap-btn');
      const toggleThemeBtn = document.getElementById('toggle-theme');
      const themeLabel = document.getElementById('theme-label');

      const imgModal = document.getElementById('imgModal');
      const imgUrl = document.getElementById('img-url');
      const imgAlt = document.getElementById('img-alt');
      const imgCancel = document.getElementById('img-cancel');
      const imgConfirm = document.getElementById('img-confirm');

      const linkModal = document.getElementById('linkModal');
      const linkText = document.getElementById('link-text');
      const linkUrl = document.getElementById('link-url');
      const linkCancel = document.getElementById('link-cancel');
      const linkConfirm = document.getElementById('link-confirm');

      const formatToggleBtn = document.getElementById('format-toggle-btn');
      const formatToolbar = document.getElementById('formatToolbar');
      const headingBtn = document.getElementById('heading-btn');
      const headingDropdown = document.getElementById('headingDropdown');
      const colorBtn = document.getElementById('color-btn');
      const colorPanel = document.getElementById('colorPanel');
      const colorGrid = document.getElementById('colorGrid');
      const customColor = document.getElementById('customColor');
      const bgcolorBtn = document.getElementById('bgcolor-btn');
      const bgColorPanel = document.getElementById('bgColorPanel');
      const bgColorGrid = document.getElementById('bgColorGrid');
      const customBgColor = document.getElementById('customBgColor');

      const progressOverlay = document.getElementById('progressOverlay');
      const progressText = document.getElementById('progressText');
      const printArea = document.getElementById('printArea');

      const toast = document.getElementById('toast');

      const hljsThemeDark = document.getElementById('hljs-theme-dark');
      const hljsThemeLight = document.getElementById('hljs-theme-light');
      const mdThemeDark = document.getElementById('md-theme-dark');
      const mdThemeLight = document.getElementById('md-theme-light');

      let layout = 'horizontal';
      let autoWrap = true;
      let isSwapped = false;
      let hasDirHandle = typeof window.showDirectoryPicker === 'function';
      let isLightTheme = false;

      let files = [];
      let currentFile = null;
      let dirHandle = null;
      let readOnlyMode = false;
      const imageMap = new Map();
      const imageUrlCache = new Map();

      let toastTimer = null;
      function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = 'toast show' + (type ? ' ' + type : '');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2500);
      }

      function showProgress(text) {
        progressText.textContent = text || '處理中...';
        progressOverlay.classList.add('show');
      }
      function hideProgress() {
        progressOverlay.classList.remove('show');
      }

      marked.setOptions({
        gfm: true, breaks: true, sanitize: false,
        highlight: function (code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try { return hljs.highlight(code, { language: lang }).value; } catch (e) { }
          }
          try { return hljs.highlightAuto(code).value; } catch (e) { return code; }
        }
      });

      function resolveImages(text) {
        return text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, path) => {
          const trimmed = path.trim();
          if (/^(https?:|data:|img:\/\/)/i.test(trimmed)) return match;
          const cleanPath = trimmed.split(/\s+/)[0];
          const normalized = cleanPath.replace(/^\.\//, '');
          if (imageMap.has(cleanPath) || imageMap.has(normalized)) {
            const blobUrl = imageMap.get(cleanPath) || imageMap.get(normalized);
            return '![' + alt + '](' + blobUrl + ')';
          }
          const fileName = cleanPath.split('/').pop();
          for (const [key, value] of imageMap.entries()) {
            if (key.endsWith('/' + fileName) || key === fileName) {
              return '![' + alt + '](' + value + ')';
            }
          }
          return match;
        });
      }

      function renderMarkdown() {
        const rawText = input.value;
        const resolvedText = resolveImages(rawText);
        if (!resolvedText.trim()) {
          preview.innerHTML = '<p class="placeholder-hint">開始輸入 Markdown 內容，這裡會即時顯示預覽...</p>';
          return;
        }
        try {
          let html = marked.parse(resolvedText);
          html = html.replace(/<img([^>]*?)>/g, function (match, attrs) {
            return '<img' + attrs + ' onerror="this.classList.add(\'img-error\'); this.alt=\'⚠️ 圖片載入失敗: \' + (this.alt || this.src);">';
          });
          preview.innerHTML = html;
        } catch (error) {
          preview.innerHTML = '<p style="color: var(--error);">解析錯誤：' + error.message + '</p>';
        }
      }

      renderMarkdown();

      let timeoutId = null;
      input.addEventListener('input', () => {
        if (timeoutId) clearTimeout(timeoutId);
        timeoutId = setTimeout(() => { renderMarkdown(); timeoutId = null; }, 100);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = input.selectionStart;
          const end = input.selectionEnd;
          const tabSpaces = '  ';
          input.value = input.value.substring(0, start) + tabSpaces + input.value.substring(end);
          input.selectionStart = input.selectionEnd = start + tabSpaces.length;
          input.dispatchEvent(new Event('input'));
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          applyWrap('**', '**', 'bold');
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') {
          e.preventDefault();
          applyWrap('*', '*', 'italic');
        }
      });

      function insertAtCursor(text) {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.value = input.value.substring(0, start) + text + input.value.substring(end);
        input.selectionStart = input.selectionEnd = start + text.length;
        input.focus();
        input.dispatchEvent(new Event('input'));
      }

      function applyWrap(openMark, closeMark, actionName) {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const value = input.value;

        if (start === end) {
          const insertText = openMark + closeMark;
          input.value = value.substring(0, start) + insertText + value.substring(end);
          input.selectionStart = input.selectionEnd = start + openMark.length;
          input.focus();
          input.dispatchEvent(new Event('input'));
          return;
        }

        const selected = value.substring(start, end);
        const before = value.substring(0, start);
        const after = value.substring(end);

        if (selected.startsWith(openMark) && selected.endsWith(closeMark) && selected.length >= openMark.length + closeMark.length) {
          const inner = selected.substring(openMark.length, selected.length - closeMark.length);
          input.value = before + inner + after;
          input.selectionStart = start;
          input.selectionEnd = start + inner.length;
          input.focus();
          input.dispatchEvent(new Event('input'));
          return;
        }

        if (before.endsWith(openMark) && after.startsWith(closeMark)) {
          const beforeTrim = before.substring(0, before.length - openMark.length);
          const afterTrim = after.substring(closeMark.length);
          input.value = beforeTrim + selected + afterTrim;
          input.selectionStart = start - openMark.length;
          input.selectionEnd = end - openMark.length;
          input.focus();
          input.dispatchEvent(new Event('input'));
          return;
        }

        if (openMark === closeMark) {
          const startsWithMark = selected.startsWith(openMark);
          const endsWithMark = selected.endsWith(closeMark);
          if ((startsWithMark && !endsWithMark) || (!startsWithMark && endsWithMark)) {
            showToast('選取範圍的樣式不完整，請重新選取', 'error');
            return;
          }
        } else {
          const hasOpen = selected.includes(openMark);
          const hasClose = selected.includes(closeMark);
          if ((hasOpen && !hasClose) || (!hasOpen && hasClose)) {
            showToast('選取範圍的樣式不完整，請重新選取', 'error');
            return;
          }
        }

        input.value = before + openMark + selected + closeMark + after;
        input.selectionStart = start + openMark.length;
        input.selectionEnd = start + openMark.length + selected.length;
        input.focus();
        input.dispatchEvent(new Event('input'));
      }

      function applyLinePrefix(prefix, actionName) {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const value = input.value;

        let lineStart = value.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = value.indexOf('\n', end);
        if (lineEnd === -1) lineEnd = value.length;

        const block = value.substring(lineStart, lineEnd);
        const lines = block.split('\n');

        const allHavePrefix = lines.every(line => line.startsWith(prefix));

        let newLines;
        if (allHavePrefix) {
          newLines = lines.map(line => line.substring(prefix.length));
        } else {
          newLines = lines.map(line => line.startsWith(prefix) ? line : prefix + line);
        }

        const newBlock = newLines.join('\n');
        input.value = value.substring(0, lineStart) + newBlock + value.substring(lineEnd);

        const delta = newBlock.length - block.length;
        input.selectionStart = lineStart;
        input.selectionEnd = lineEnd + delta;
        input.focus();
        input.dispatchEvent(new Event('input'));
      }

      function applyHeading(level) {
        const start = input.selectionStart;
        const value = input.value;
        let lineStart = value.lastIndexOf('\n', start - 1) + 1;
        let lineEnd = value.indexOf('\n', start);
        if (lineEnd === -1) lineEnd = value.length;

        const line = value.substring(lineStart, lineEnd);
        const match = line.match(/^(#{1,6})\s?(.*)$/);

        let newLine;
        if (match) {
          const currentLevel = match[1].length;
          const content = match[2];
          if (currentLevel === level) {
            newLine = content;
          } else {
            newLine = '#'.repeat(level) + ' ' + content;
          }
        } else {
          newLine = '#'.repeat(level) + ' ' + line;
        }

        input.value = value.substring(0, lineStart) + newLine + value.substring(lineEnd);
        const newCursor = lineStart + newLine.length;
        input.selectionStart = input.selectionEnd = newCursor;
        input.focus();
        input.dispatchEvent(new Event('input'));
      }

      function applyFormat(action) {
        switch (action) {
          case 'bold': applyWrap('**', '**', 'bold'); break;
          case 'italic': applyWrap('*', '*', 'italic'); break;
          case 'strike': applyWrap('~~', '~~', 'strike'); break;
          case 'inline-code': applyWrap('`', '`', 'inline-code'); break;
          case 'codeblock': applyWrap('```\n', '\n```', 'codeblock'); break;
          case 'mark': applyWrap('<mark>', '</mark>', 'mark'); break;
          case 'quote': applyLinePrefix('> ', 'quote'); break;
          case 'ul': applyLinePrefix('- ', 'ul'); break;
          case 'hr': insertAtCursor('\n---\n'); break;
          case 'br': insertAtCursor('<br>'); break;
          case 'link': openLinkModal(); break;
          case 'image': openImageModal(); break;
        }
      }

      formatToolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('.format-btn');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action) applyFormat(action);
      });

      formatToggleBtn.addEventListener('click', () => {
        const isOpen = formatToolbar.classList.toggle('show');
        formatToggleBtn.classList.toggle('active', isOpen);
        closeAllFormatDropdowns();
      });

      headingBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = headingDropdown.classList.contains('open');
        closeAllFormatDropdowns();
        if (!wasOpen) headingDropdown.classList.add('open');
      });

      headingDropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.heading-item');
        if (!item) return;
        const level = parseInt(item.dataset.level, 10);
        applyHeading(level);
        headingDropdown.classList.remove('open');
      });

      const presetColors = [
        '#ff0000', '#ff6b00', '#ffd93d', '#4ec9b0', '#569cd6',
        '#c586c0', '#808080', '#ffffff', '#000000', '#8b4513'
      ];
      const presetBgColors = [
        '#ffeb3b', '#ffcdd2', '#c8e6c9', '#bbdefb', '#e1bee7',
        '#ffe0b2', '#f5f5f5', '#bdbdbd', '#4ec9b0', '#569cd6'
      ];

      function buildColorGrid(gridEl, colors, isBg) {
        gridEl.innerHTML = '';
        colors.forEach(color => {
          const swatch = document.createElement('div');
          swatch.className = 'color-swatch';
          swatch.style.backgroundColor = color;
          swatch.title = color;
          swatch.addEventListener('click', () => {
            applyColor(color, isBg);
            closeAllFormatDropdowns();
          });
          gridEl.appendChild(swatch);
        });
      }

      buildColorGrid(colorGrid, presetColors, false);
      buildColorGrid(bgColorGrid, presetBgColors, true);

      customColor.addEventListener('change', () => {
        applyColor(customColor.value, false);
        closeAllFormatDropdowns();
      });
      customBgColor.addEventListener('change', () => {
        applyColor(customBgColor.value, true);
        closeAllFormatDropdowns();
      });

      function applyColor(color, isBg) {
        if (isBg) {
          applyWrap('<span style="background-color:' + color + '">', '</span>', 'bgcolor');
        } else {
          applyWrap('<font color="' + color + '">', '</font>', 'color');
        }
      }

      colorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = colorPanel.classList.contains('open');
        closeAllFormatDropdowns();
        if (!wasOpen) colorPanel.classList.add('open');
      });

      bgcolorBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = bgColorPanel.classList.contains('open');
        closeAllFormatDropdowns();
        if (!wasOpen) bgColorPanel.classList.add('open');
      });

      colorPanel.addEventListener('click', (e) => e.stopPropagation());
      bgColorPanel.addEventListener('click', (e) => e.stopPropagation());

      function closeAllFormatDropdowns() {
        headingDropdown.classList.remove('open');
        colorPanel.classList.remove('open');
        bgColorPanel.classList.remove('open');
      }

      // ===== 主題切換 =====
      function applyTheme(isLight) {
        isLightTheme = isLight;
        if (isLight) {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-light');
          hljsThemeDark.disabled = true;
          hljsThemeLight.disabled = false;
          mdThemeDark.disabled = true;
          mdThemeLight.disabled = false;
          themeLabel.textContent = '深色模式';
          document.getElementById('theme-icon').innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
        } else {
          document.body.classList.remove('theme-light');
          document.body.classList.add('theme-dark');
          hljsThemeDark.disabled = false;
          hljsThemeLight.disabled = true;
          mdThemeDark.disabled = false;
          mdThemeLight.disabled = true;
          themeLabel.textContent = '淺色模式';
          document.getElementById('theme-icon').innerHTML = '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>';
        }
        try { localStorage.setItem('md-editor-theme', isLight ? 'light' : 'dark'); } catch (e) { }
      }

      toggleThemeBtn.addEventListener('click', () => {
        applyTheme(!isLightTheme);
        closeAllDropdowns();
        renderMarkdown();
      });

      (function initTheme() {
        try {
          const saved = localStorage.getItem('md-editor-theme');
          if (saved === 'light') {
            applyTheme(true);
            return;
          }
        } catch (e) { }
        applyTheme(false);
      })();

      // ===== 連結對話框 =====
      function openLinkModal() {
        const start = input.selectionStart;
        const end = input.selectionEnd;
        if (start !== end) {
          linkText.value = input.value.substring(start, end);
        } else {
          linkText.value = '';
        }
        linkUrl.value = '';
        linkModal.classList.add('open');
        setTimeout(() => (linkText.value ? linkUrl.focus() : linkText.focus()), 50);
      }

      linkCancel.addEventListener('click', () => linkModal.classList.remove('open'));
      linkModal.addEventListener('click', (e) => { if (e.target === linkModal) linkModal.classList.remove('open'); });

      linkConfirm.addEventListener('click', () => {
        const text = linkText.value.trim() || '連結文字';
        const url = linkUrl.value.trim();
        if (!url) { showToast('請輸入網址', 'error'); return; }
        const start = input.selectionStart;
        const end = input.selectionEnd;
        if (start !== end) {
          const value = input.value;
          const before = value.substring(0, start);
          const after = value.substring(end);
          const insert = '[' + text + '](' + url + ')';
          input.value = before + insert + after;
          input.selectionStart = start;
          input.selectionEnd = start + insert.length;
        } else {
          insertAtCursor('[' + text + '](' + url + ')');
        }
        input.focus();
        input.dispatchEvent(new Event('input'));
        linkModal.classList.remove('open');
      });

      linkText.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); linkUrl.focus(); } });
      linkUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); linkConfirm.click(); } });

      // ===== 圖片對話框 =====
      function openImageModal() {
        imgUrl.value = '';
        imgAlt.value = '';
        imgModal.classList.add('open');
        setTimeout(() => imgUrl.focus(), 50);
      }

      imgCancel.addEventListener('click', () => imgModal.classList.remove('open'));
      imgModal.addEventListener('click', (e) => { if (e.target === imgModal) imgModal.classList.remove('open'); });
      imgUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); imgConfirm.click(); } });
      imgAlt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); imgConfirm.click(); } });

      imgConfirm.addEventListener('click', () => {
        const url = imgUrl.value.trim();
        const alt = imgAlt.value.trim() || '圖片';
        if (!url) { showToast('請輸入圖片網址', 'error'); return; }
        insertAtCursor('![' + alt + '](' + url + ')');
        imgModal.classList.remove('open');
      });

      (function addLocalImageButton() {
        const actions = imgModal.querySelector('.modal-actions');
        const localBtn = document.createElement('button');
        localBtn.textContent = '從本機選擇';
        localBtn.type = 'button';
        localBtn.style.marginRight = 'auto';
        localBtn.addEventListener('click', () => imageInput.click());
        actions.insertBefore(localBtn, actions.firstChild);
      })();

      imageInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast('請選擇圖片檔案', 'error');
          imageInput.value = '';
          return;
        }
        const maxSize = 5 * 1024 * 1024;
        if (file.size > maxSize) {
          if (!confirm('這張圖片超過 5MB，轉成 Base64 會讓檔案變很大。確定要繼續嗎？')) {
            imageInput.value = '';
            return;
          }
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const base64 = ev.target.result;
          const alt = file.name.replace(/\.[^.]+$/, '') || '圖片';
          insertAtCursor('\n![' + alt + '](' + base64 + ')\n');
          imgModal.classList.remove('open');
        };
        reader.onerror = () => showToast('圖片讀取失敗', 'error');
        reader.readAsDataURL(file);
        imageInput.value = '';
      });

      // ===== 檔案清單 =====
      function renderFileList() {
        if (files.length === 0) {
          sidebarBody.innerHTML = '<div class="sidebar-empty">資料夾裡沒有可編輯的檔案</div>';
          return;
        }
        const ul = document.createElement('ul');
        ul.className = 'file-list';
        files.forEach((f) => {
          const li = document.createElement('li');
          li.className = 'file-item' + (currentFile && currentFile.path === f.path ? ' active' : '');
          li.title = f.path;
          const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          icon.setAttribute('viewBox', '0 0 24 24');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11z');
          icon.appendChild(path);
          li.appendChild(icon);
          const name = document.createElement('span');
          name.textContent = f.name;
          name.style.overflow = 'hidden';
          name.style.textOverflow = 'ellipsis';
          name.style.whiteSpace = 'nowrap';
          li.appendChild(name);
          li.addEventListener('click', () => openFile(f));
          ul.appendChild(li);
        });
        sidebarBody.innerHTML = '';
        sidebarBody.appendChild(ul);
      }

      function updateSidebarFooter() {
        if (files.length === 0) {
          sidebarFooter.style.display = 'none';
        } else {
          sidebarFooter.style.display = 'flex';
          fileCount.textContent = files.length + ' 個檔案';
          modeLabel.textContent = readOnlyMode ? '唯讀模式' : '完整模式';
          modeLabel.style.color = readOnlyMode ? '#dcb67a' : 'var(--success)';
        }
      }

      async function openFile(file) {
        currentFile = file;
        currentFileName.textContent = file.name;
        saveBtn.disabled = readOnlyMode || !file.handle;
        try {
          let content;
          if (file.handle) {
            const f = await file.handle.getFile();
            content = await f.text();
          } else if (file.content !== undefined) {
            content = file.content;
          } else {
            throw new Error('無法讀取檔案內容');
          }
          input.value = content;
          input.setSelectionRange(0, 0);
          input.scrollTop = 0;
          renderMarkdown();
          renderFileList();
          input.focus();
        } catch (err) {
          showToast('讀取檔案失敗：' + err.message, 'error');
        }
      }

      function toggleSidebar() {
        sidebar.classList.toggle('collapsed');
      }

      toggleSidebarTopBtn.addEventListener('click', toggleSidebar);
      collapseSidebarBtn.addEventListener('click', toggleSidebar);

      function showSidebar() {
        sidebar.classList.remove('collapsed');
      }

      // ===== 下拉選單 =====
      function closeAllDropdowns() {
        fileMenu.classList.remove('open');
        exportMenu.classList.remove('open');
        settingsDropdown.classList.remove('open');
      }

      fileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = fileMenu.classList.contains('open');
        closeAllDropdowns();
        if (!wasOpen) fileMenu.classList.add('open');
      });

      exportMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = exportMenu.classList.contains('open');
        closeAllDropdowns();
        if (!wasOpen) exportMenu.classList.add('open');
      });

      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = settingsDropdown.classList.contains('open');
        closeAllDropdowns();
        if (!wasOpen) settingsDropdown.classList.add('open');
      });

      document.addEventListener('click', (e) => {
        if (!fileMenu.contains(e.target) && e.target !== fileMenuBtn) {
          fileMenu.classList.remove('open');
        }
        if (!exportMenu.contains(e.target) && e.target !== exportMenuBtn) {
          exportMenu.classList.remove('open');
        }
        if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
          settingsDropdown.classList.remove('open');
        }
        if (!headingDropdown.contains(e.target) && e.target !== headingBtn) {
          headingDropdown.classList.remove('open');
        }
        if (!colorPanel.contains(e.target) && e.target !== colorBtn) {
          colorPanel.classList.remove('open');
        }
        if (!bgColorPanel.contains(e.target) && e.target !== bgcolorBtn) {
          bgColorPanel.classList.remove('open');
        }
      });

      fileMenu.addEventListener('click', (e) => e.stopPropagation());
      exportMenu.addEventListener('click', (e) => e.stopPropagation());
      settingsDropdown.addEventListener('click', (e) => e.stopPropagation());

      // ===== 打開資料夾 =====
      if (hasDirHandle) {
        openFolderBtn.addEventListener('click', async () => {
          closeAllDropdowns();
          try {
            dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            await loadDirectoryFromHandle(dirHandle);
            readOnlyMode = false;
            folderNameText.textContent = dirHandle.name;
            showSidebar();
            updateSidebarFooter();
            showToast('已開啟資料夾：' + dirHandle.name, 'success');
          } catch (err) {
            if (err.name !== 'AbortError') {
              showToast('開啟資料夾失敗：' + err.message, 'error');
            }
          }
        });
      } else {
        openFolderBtn.addEventListener('click', () => {
          closeAllDropdowns();
          showToast('此瀏覽器不支援資料夾模式，請改用「選擇多個檔案」', 'error');
        });
        openFolderBtn.disabled = true;
      }

      async function loadDirectoryFromHandle(handle) {
        files = [];
        imageMap.clear();
        for (const url of imageUrlCache.values()) URL.revokeObjectURL(url);
        imageUrlCache.clear();
        await scanDirectory(handle, '');
        files.sort((a, b) => a.path.localeCompare(b.path));
        renderFileList();
        updateSidebarFooter();
      }

      async function scanDirectory(handle, path) {
        for await (const entry of handle.values()) {
          const entryPath = path ? path + '/' + entry.name : entry.name;
          if (entry.kind === 'file') {
            const lower = entry.name.toLowerCase();
            if (/\.(md|markdown|txt)$/.test(lower)) {
              files.push({ name: entry.name, path: entryPath, handle: entry, type: 'md' });
            } else if (/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/.test(lower)) {
              try {
                const file = await entry.getFile();
                const blobUrl = URL.createObjectURL(file);
                imageUrlCache.set(entryPath, blobUrl);
                imageMap.set(entryPath, blobUrl);
                if (!imageMap.has(entry.name)) imageMap.set(entry.name, blobUrl);
              } catch (e) {
                console.warn('載入圖片失敗:', entryPath, e);
              }
            }
          } else if (entry.kind === 'directory') {
            await scanDirectory(entry, entryPath);
          }
        }
      }

      openFilesBtn.addEventListener('click', () => {
        closeAllDropdowns();
        folderInput.click();
      });

      folderInput.addEventListener('change', async (e) => {
        const fileList = Array.from(e.target.files || []);
        if (fileList.length === 0) return;
        files = [];
        imageMap.clear();
        for (const url of imageUrlCache.values()) URL.revokeObjectURL(url);
        imageUrlCache.clear();
        let rootName = '已選擇的檔案';
        if (fileList[0].webkitRelativePath) {
          const first = fileList[0].webkitRelativePath;
          rootName = first.split('/')[0] || '已選擇的檔案';
        }
        for (const f of fileList) {
          const path = f.webkitRelativePath || f.name;
          const lower = f.name.toLowerCase();
          if (/\.(md|markdown|txt)$/.test(lower)) {
            const content = await f.text();
            files.push({ name: f.name, path: path, handle: null, content: content, type: 'md' });
          } else if (/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/.test(lower)) {
            const blobUrl = URL.createObjectURL(f);
            imageUrlCache.set(path, blobUrl);
            imageMap.set(path, blobUrl);
            const relativePath = path.replace(/^[^/]+\//, '');
            if (relativePath !== path) imageMap.set(relativePath, blobUrl);
            if (!imageMap.has(f.name)) imageMap.set(f.name, blobUrl);
          }
        }
        readOnlyMode = true;
        dirHandle = null;
        folderNameText.textContent = rootName;
        showSidebar();
        files.sort((a, b) => a.path.localeCompare(b.path));
        renderFileList();
        updateSidebarFooter();
        if (files.length === 0) {
          showToast('選的資料夾裡沒有 .md / .txt 檔', 'error');
        } else {
          showToast('已載入 ' + files.length + ' 個檔案（唯讀模式）', 'success');
        }
        folderInput.value = '';
      });

      // ===== 儲存（按鈕 + Ctrl+S / Cmd+S）=====
      async function saveCurrentFile() {
        if (!currentFile) {
          showToast('請先開啟一個檔案', 'error');
          return;
        }
        if (readOnlyMode || !currentFile.handle) {
          showToast('唯讀模式無法儲存，請用「導出」下載', 'error');
          return;
        }
        try {
          const writable = await currentFile.handle.createWritable();
          await writable.write(input.value);
          await writable.close();
          showToast('已儲存：' + currentFile.name, 'success');
        } catch (err) {
          showToast('儲存失敗：' + err.message, 'error');
        }
      }

      saveBtn.addEventListener('click', saveCurrentFile);

      // ★ 全域攔截 Ctrl+S / Cmd+S
      document.addEventListener('keydown', (e) => {
        // Ctrl+S（Windows/Linux）或 Cmd+S（Mac）
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') {
          e.preventDefault(); // 攔截瀏覽器預設的「儲存網頁」
          e.stopPropagation();
          saveCurrentFile();
        }
      }, true); // 用 capture 階段，比 input 的 keydown 更早攔截

      importBtn.addEventListener('click', () => {
        closeAllDropdowns();
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          input.value = ev.target.result;
          input.scrollTop = 0;
          currentFileName.textContent = file.name;
          currentFile = null;
          saveBtn.disabled = true;
          renderMarkdown();
          input.focus();
        };
        reader.onerror = () => showToast('檔案讀取失敗', 'error');
        reader.readAsText(file, 'UTF-8');
        fileInput.value = '';
      });

      // ===== 導出功能 =====
      exportMdBtn.addEventListener('click', () => {
        closeAllDropdowns();
        const content = input.value;
        if (!content.trim()) { showToast('目前沒有內容可以導出', 'error'); return; }
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        downloadBlob(blob, getBaseName() + '.md');
      });

      exportHtmlBtn.addEventListener('click', async () => {
        closeAllDropdowns();
        const content = input.value;
        if (!content.trim()) { showToast('目前沒有內容可以導出', 'error'); return; }

        showProgress('正在處理圖片...');
        try {
          const htmlContent = await generateStandaloneHtml();
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          downloadBlob(blob, getBaseName() + '.html');
          showToast('已導出 HTML', 'success');
        } catch (err) {
          console.error(err);
          showToast('導出失敗：' + err.message, 'error');
        } finally {
          hideProgress();
        }
      });

      exportPdfBtn.addEventListener('click', () => {
        closeAllDropdowns();
        const content = input.value;
        if (!content.trim()) { showToast('目前沒有內容可以導出', 'error'); return; }
        const previewHtml = preview.innerHTML;
        printArea.innerHTML = previewHtml;
        setTimeout(() => { window.print(); }, 100);
        showToast('在列印對話框選「另存為 PDF」', 'success');
      });

      exportPngBtn.addEventListener('click', async () => {
        closeAllDropdowns();
        const content = input.value;
        if (!content.trim()) { showToast('目前沒有內容可以導出', 'error'); return; }

        showProgress('載入截圖工具...');
        try {
          await loadHtml2Canvas();
          showProgress('產生圖片中...');

          const previewContent = document.getElementById('previewContent');
          const originalOverflow = previewContent.style.overflow;
          const originalHeight = previewContent.style.height;
          const originalMaxHeight = previewContent.style.maxHeight;
          previewContent.style.overflow = 'visible';
          previewContent.style.height = 'auto';
          previewContent.style.maxHeight = 'none';

          await new Promise(r => setTimeout(r, 50));

          const isLight = document.body.classList.contains('theme-light');
          const canvas = await html2canvas(preview, {
            backgroundColor: isLight ? '#ffffff' : '#1e1e1e',
            scale: 2,
            useCORS: true,
            allowTaint: true,
            logging: false,
            windowWidth: preview.scrollWidth,
            windowHeight: preview.scrollHeight
          });

          previewContent.style.overflow = originalOverflow;
          previewContent.style.height = originalHeight;
          previewContent.style.maxHeight = originalMaxHeight;

          canvas.toBlob((blob) => {
            if (blob) {
              downloadBlob(blob, getBaseName() + '.png');
              showToast('已導出 PNG', 'success');
            } else {
              showToast('產生圖片失敗', 'error');
            }
          }, 'image/png');
        } catch (err) {
          console.error(err);
          showToast('導出失敗：' + err.message, 'error');
        } finally {
          hideProgress();
        }
      });

      // ===== 輔助函式 =====
      function getBaseName() {
        if (currentFile) {
          return currentFile.name.replace(/\.[^.]+$/, '');
        }
        return 'document';
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function loadHtml2Canvas() {
        return new Promise((resolve, reject) => {
          if (window.html2canvas) { resolve(); return; }
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          script.onload = resolve;
          script.onerror = () => reject(new Error('無法載入截圖工具'));
          document.head.appendChild(script);
        });
      }

      function blobUrlToBase64(blobUrl) {
        return new Promise((resolve, reject) => {
          fetch(blobUrl)
            .then(res => res.blob())
            .then(blob => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            })
            .catch(reject);
        });
      }

      async function generateStandaloneHtml() {
        const previewHtml = preview.innerHTML;

        const blobUrls = [];
        previewHtml.replace(/src="(blob:[^"]+)"/g, (match, url) => {
          blobUrls.push(url);
          return match;
        });

        let finalHtml = previewHtml;
        let processed = 0;

        for (const blobUrl of blobUrls) {
          try {
            const base64 = await blobUrlToBase64(blobUrl);
            finalHtml = finalHtml.split(blobUrl).join(base64);
            processed++;
            showProgress('處理圖片 ' + processed + ' / ' + blobUrls.length);
          } catch (err) {
            console.warn('轉換失敗:', blobUrl, err);
          }
        }

        const isLight = document.body.classList.contains('theme-light');
        const bgColor = isLight ? '#ffffff' : '#1e1e1e';
        const textColor = isLight ? '#24292e' : '#d4d4d4';
        const hColor = isLight ? '#1a1a1a' : '#e0e0e0';
        const borderColor = isLight ? '#e1e4e8' : '#3c3c3c';
        const linkColor = isLight ? '#0366d6' : '#569cd6';
        const codeBg = isLight ? '#f6f8fa' : '#2d2d2d';
        const blockquoteColor = isLight ? '#6a737d' : '#a0a0a0';
        const tableBg = isLight ? '#f6f8fa' : '#252526';
        const tableBorder = isLight ? '#dfe2e5' : '#3c3c3c';
        const markBg = isLight ? '#fff5b1' : '#ffd93d';
        const markText = isLight ? '#24292e' : '#1e1e1e';

        const styles = `
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
        background-color: ${bgColor};
        color: ${textColor};
        padding: 40px 20px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      .container { max-width: 900px; margin: 0 auto; }
      h1, h2, h3, h4, h5, h6 { color: ${hColor}; margin: 1.2em 0 0.6em; font-weight: 600; }
      h1 { font-size: 2em; border-bottom: 1px solid ${borderColor}; padding-bottom: 0.3em; }
      h2 { font-size: 1.5em; border-bottom: 1px solid ${borderColor}; padding-bottom: 0.3em; }
      h3 { font-size: 1.25em; }
      p { margin: 0.8em 0; }
      a { color: ${linkColor}; text-decoration: none; }
      a:hover { text-decoration: underline; }
      code {
        background-color: ${codeBg};
        color: ${textColor};
        padding: 0.2em 0.4em;
        border-radius: 4px;
        font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
        font-size: 0.9em;
      }
      pre {
        background-color: ${codeBg};
        border-radius: 6px;
        padding: 16px;
        overflow-x: auto;
        border: 1px solid ${borderColor};
        margin: 1em 0;
      }
      pre code { background-color: transparent; padding: 0; font-size: 0.9em; line-height: 1.5; }
      blockquote { border-left: 4px solid ${borderColor}; padding-left: 16px; margin: 1em 0; color: ${blockquoteColor}; }
      ul, ol { padding-left: 2em; margin: 0.8em 0; }
      li { margin: 0.3em 0; }
      table { border-collapse: collapse; margin: 1em 0; width: auto; max-width: 100%; overflow-x: auto; display: block; }
      table th, table td { border: 1px solid ${tableBorder}; padding: 6px 13px; }
      table th { background-color: ${codeBg}; font-weight: 600; }
      table tr:nth-child(2n) { background-color: ${tableBg}; }
      hr { border: none; border-top: 1px solid ${borderColor}; margin: 1.5em 0; }
      img { max-width: 100%; height: auto; display: block; margin: 12px 0; border-radius: 6px; border: 1px solid ${borderColor}; }
      mark { background-color: ${markBg}; color: ${markText}; padding: 0.1em 0.3em; border-radius: 3px; }
      .hljs { color: #abb2bf; background: #282c34; }
      .hljs-comment, .hljs-quote { color: #5c6370; font-style: italic; }
      .hljs-doctag, .hljs-keyword, .hljs-formula { color: #c678dd; }
      .hljs-section, .hljs-name, .hljs-selector-tag, .hljs-deletion, .hljs-subst { color: #e06c75; }
      .hljs-literal { color: #56b6c2; }
      .hljs-string, .hljs-regexp, .hljs-addition, .hljs-attribute, .hljs-meta .hljs-string { color: #98c379; }
      .hljs-attr, .hljs-variable, .hljs-template-variable, .hljs-type, .hljs-selector-class, .hljs-selector-attr, .hljs-selector-pseudo, .hljs-number { color: #d19a66; }
      .hljs-symbol, .hljs-bullet, .hljs-link, .hljs-meta, .hljs-selector-id, .hljs-title { color: #61aeee; }
      .hljs-built_in, .hljs-title.class_, .hljs-class .hljs-title { color: #e6c07b; }
      .hljs-emphasis { font-style: italic; }
      .hljs-strong { font-weight: bold; }
    `;

        return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(getBaseName())}</title>
<style>${styles}</style>
</head>
<body>
<div class="container">
${finalHtml}
</div>
</body>
</html>`;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // ===== Flex 角色 =====
      function applyFlexRoles() {
        const prev = divider.previousElementSibling;
        const next = divider.nextElementSibling;
        if (prev) { prev.classList.add('panel-fixed'); prev.classList.remove('panel-flex'); }
        if (next) { next.classList.add('panel-flex'); next.classList.remove('panel-fixed'); }
      }

      function updateTitles() {
        const sourceTitleEl = sourcePanel.querySelector('.title > span:not(.file-name)');
        const previewTitleEl = previewPanel.querySelector('.title > span:not(.file-name)');
        if (sourceTitleEl) sourceTitleEl.textContent = 'Markdown 源碼';
        if (previewTitleEl) previewTitleEl.textContent = '預覽效果';
      }

      let isResizing = false;
      let startCoord = 0;
      let startSize = 0;
      let targetPanel = null;

      function getContainerSize() {
        const rect = container.getBoundingClientRect();
        return layout === 'horizontal' ? rect.width : rect.height;
      }
      function getDividerSize() {
        const rect = divider.getBoundingClientRect();
        return layout === 'horizontal' ? rect.width : rect.height;
      }
      function getPanelSize(panel) {
        const rect = panel.getBoundingClientRect();
        return layout === 'horizontal' ? rect.width : rect.height;
      }

      function startResize(coord) {
        let prev = divider.previousElementSibling;
        if (!prev) return;
        targetPanel = prev;
        isResizing = true;
        startCoord = coord;
        startSize = getPanelSize(targetPanel);
        divider.classList.add('active');
        document.body.classList.add('resizing');
        container.classList.add('resizing');
      }

      function doResize(coord) {
        if (!isResizing || !targetPanel) return;
        const total = getContainerSize();
        const dividerSize = getDividerSize();
        const minSize = 100;
        const delta = coord - startCoord;
        let newSize = startSize + delta;
        if (newSize < minSize) newSize = minSize;
        if (newSize > total - dividerSize - minSize) newSize = total - dividerSize - minSize;
        if (layout === 'horizontal') {
          targetPanel.style.width = newSize + 'px';
          targetPanel.style.height = '';
        } else {
          targetPanel.style.height = newSize + 'px';
          targetPanel.style.width = '';
        }
      }

      function stopResize() {
        if (!isResizing) return;
        isResizing = false;
        targetPanel = null;
        divider.classList.remove('active');
        document.body.classList.remove('resizing');
        container.classList.remove('resizing');
      }

      function getCoord(e) {
        if (e.touches && e.touches.length > 0) {
          return layout === 'horizontal' ? e.touches[0].clientX : e.touches[0].clientY;
        }
        return layout === 'horizontal' ? e.clientX : e.clientY;
      }

      divider.addEventListener('mousedown', (e) => { e.preventDefault(); startResize(getCoord(e)); });
      window.addEventListener('mousemove', (e) => { if (isResizing) { e.preventDefault(); doResize(getCoord(e)); } });
      window.addEventListener('mouseup', stopResize);
      divider.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { e.preventDefault(); startResize(getCoord(e)); }
      }, { passive: false });
      window.addEventListener('touchmove', (e) => {
        if (isResizing && e.touches.length === 1) { e.preventDefault(); doResize(getCoord(e)); }
      }, { passive: false });
      window.addEventListener('touchend', stopResize);
      window.addEventListener('touchcancel', stopResize);

      function setLayout(newLayout) {
        layout = newLayout;
        container.classList.remove('horizontal', 'vertical');
        container.classList.add(layout);
        sourcePanel.style.width = '';
        sourcePanel.style.height = '';
        previewPanel.style.width = '';
        previewPanel.style.height = '';
        applyFlexRoles();
        if (layout === 'horizontal') {
          const fixedPanel = divider.previousElementSibling;
          if (fixedPanel) fixedPanel.style.width = '50%';
          checkHorizontal.style.visibility = 'visible';
          checkVertical.style.visibility = 'hidden';
        } else {
          const fixedPanel = divider.previousElementSibling;
          if (fixedPanel) fixedPanel.style.height = '50%';
          checkHorizontal.style.visibility = 'hidden';
          checkVertical.style.visibility = 'visible';
        }
      }

      layoutHorizontalBtn.addEventListener('click', () => { setLayout('horizontal'); closeAllDropdowns(); });
      layoutVerticalBtn.addEventListener('click', () => { setLayout('vertical'); closeAllDropdowns(); });

      function setAutoWrap(enabled) {
        autoWrap = enabled;
        if (enabled) {
          input.classList.remove('nowrap');
          input.classList.add('wrap');
          preview.classList.remove('nowrap-mode');
          preview.classList.add('wrap-mode');
          checkWrap.style.visibility = 'visible';
        } else {
          input.classList.remove('wrap');
          input.classList.add('nowrap');
          preview.classList.remove('wrap-mode');
          preview.classList.add('nowrap-mode');
          checkWrap.style.visibility = 'hidden';
        }
      }

      toggleWrapBtn.addEventListener('click', () => { setAutoWrap(!autoWrap); closeAllDropdowns(); });

      swapBtn.addEventListener('click', () => {
        isSwapped = !isSwapped;
        sourcePanel.style.width = '';
        sourcePanel.style.height = '';
        previewPanel.style.width = '';
        previewPanel.style.height = '';
        if (isSwapped) {
          container.appendChild(previewPanel);
          container.appendChild(divider);
          container.appendChild(sourcePanel);
        } else {
          container.appendChild(sourcePanel);
          container.appendChild(divider);
          container.appendChild(previewPanel);
        }
        updateTitles();
        applyFlexRoles();
        const fixedPanel = divider.previousElementSibling;
        if (fixedPanel) {
          if (layout === 'horizontal') fixedPanel.style.width = '50%';
          else fixedPanel.style.height = '50%';
        }
      });

      window.addEventListener('resize', () => {
        const fixedPanel = divider.previousElementSibling;
        if (!fixedPanel) return;
        const current = getPanelSize(fixedPanel);
        if (!current) return;
        const total = getContainerSize();
        const dividerSize = getDividerSize();
        const minSize = 100;
        let newSize = current;
        if (newSize > total - dividerSize - minSize) newSize = total - dividerSize - minSize;
        if (newSize < minSize) newSize = minSize;
        if (layout === 'horizontal') fixedPanel.style.width = newSize + 'px';
        else fixedPanel.style.height = newSize + 'px';
      });

      setLayout('horizontal');
      setAutoWrap(true);
      updateTitles();

      if (!hasDirHandle) {
        openFolderBtn.title = '此瀏覽器不支援資料夾模式，請用「選擇多個檔案」';
      }

      console.log('%c💡 Ctrl+S / Cmd+S 儲存檔案（需先開啟資料夾）', 'color: #569cd6; font-size: 13px;');
    })();
    // 註冊 Service Worker 實現 PWA 離線功能
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('PWA 註冊成功！', registration.scope))
          .catch(err => console.log('PWA 註冊失敗：', err));
      });
    }
  </script>
</body>

</html>
