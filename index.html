<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>墨盒．InkBox</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    id="hljs-theme-dark">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css"
    id="hljs-theme-light" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css"
    id="md-theme-dark">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css"
    id="md-theme-light" disabled>
  <!-- 告訴瀏覽器這是一個 PWA App -->
  <link rel="manifest" href="manifest.json">
  <!-- 手機端專用的主題色（會影響手機頂部狀態列） -->
  <meta name="theme-color" content="#1e1e1e">
  <!-- 網頁分頁的圖示 (可選) -->
  <!-- <link rel="icon" href="icon-192.png" type="image/png"> -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    /* ===== 主題變數 ===== */
    :root,
    body.theme-dark {
      --bg-main: #1e1e1e;
      --bg-topbar: #323233;
      --bg-panel-header: #252526;
      --bg-sidebar: #252526;
      --bg-sidebar-hover: #2a2d2e;
      --bg-sidebar-active: #094771;
      --bg-input: #1e1e1e;
      --bg-preview: #1e1e1e;
      --bg-btn: #3a3d41;
      --bg-btn-hover: #4a4d51;
      --bg-btn-active: #2a2d31;
      --bg-dropdown: #2d2d30;
      --bg-toolbar: #2a2d2e;
      --bg-code: #2d2d2d;
      --bg-code-border: #3e3e3e;
      --bg-toast: #2d2d30;
      --bg-modal: #2d2d30;
      --bg-divider: #2a2a2a;
      --bg-table-nth: #252526;
      --bg-progress: rgba(0, 0, 0, 0.7);
      --border-main: #3c3c3c;
      --border-input: #4a4d51;
      --border-hover: #5a5d61;
      --border-dropdown: #454545;
      --text-main: #d4d4d4;
      --text-bright: #e0e0e0;
      --text-dim: #cccccc;
      --text-muted: #808080;
      --text-faint: #6a6a6a;
      --text-link: #569cd6;
      --accent: #0e639c;
      --accent-hover: #1177bb;
      --accent-border: #1177bb;
      --success: #4ec9b0;
      --error: #f48771;
      --selection: #264f78;
      --selection-text: #ffffff;
      --scrollbar-track: #1e1e1e;
      --scrollbar-thumb: #424242;
      --scrollbar-thumb-hover: #4f4f4f;
      --brand-icon: #569cd6;
      --svg-icon: #519aba;
      --folder-icon: #dcb67a;
      --format-bg: #3a3d41;
      --format-hover: #4a4d51;
      --format-border: #4a4d51;
      --format-active-bg: #0e639c;
      --format-active-border: #1177bb;
      --format-active-text: #ffffff;
      --heading-accent: #569cd6;
      --color-panel-bg: #2d2d30;
      --color-panel-border: #454545;
      --color-panel-title: #808080;
      --color-panel-label: #a0a0a0;
      --modal-overlay: rgba(0, 0, 0, 0.6);
      --toast-border: #4a4d51;
      --table-border: #3c3c3c;
      --pre-bg: #2d2d2d;
      --pre-border: #3e3e3e;
      --hr-color: #3c3c3c;
      --blockquote-border: #3c3c3c;
      --blockquote-text: #a0a0a0;
      --img-border: #3e3e3e;
      --img-bg: #252526;
      --img-error-bg: #3a1e1e;
      --img-error-border: #f48771;
      --mark-bg: #ffd93d;
      --mark-text: #1e1e1e;
      --placeholder: #6a6a6a;
    }

    body.theme-light {
      --bg-main: #ffffff;
      --bg-topbar: #f3f3f3;
      --bg-panel-header: #f3f3f3;
      --bg-sidebar: #f3f3f3;
      --bg-sidebar-hover: #e8e8e8;
      --bg-sidebar-active: #cce4f7;
      --bg-input: #ffffff;
      --bg-preview: #ffffff;
      --bg-btn: #e8e8e8;
      --bg-btn-hover: #d8d8d8;
      --bg-btn-active: #cccccc;
      --bg-dropdown: #ffffff;
      --bg-toolbar: #f3f3f3;
      --bg-code: #f6f8fa;
      --bg-code-border: #e1e4e8;
      --bg-toast: #333333;
      --bg-modal: #ffffff;
      --bg-divider: #e0e0e0;
      --bg-table-nth: #f6f8fa;
      --bg-progress: rgba(255, 255, 255, 0.85);
      --border-main: #e0e0e0;
      --border-input: #d0d0d0;
      --border-hover: #b0b0b0;
      --border-dropdown: #d0d0d0;
      --text-main: #24292e;
      --text-bright: #1a1a1a;
      --text-dim: #333333;
      --text-muted: #6a737d;
      --text-faint: #8a8a8a;
      --text-link: #0366d6;
      --accent: #0366d6;
      --accent-hover: #0052b3;
      --accent-border: #0052b3;
      --success: #22863a;
      --error: #d73a49;
      --selection: #b3d7ff;
      --selection-text: #000000;
      --scrollbar-track: #f0f0f0;
      --scrollbar-thumb: #c0c0c0;
      --scrollbar-thumb-hover: #a0a0a0;
      --brand-icon: #0366d6;
      --svg-icon: #0366d6;
      --folder-icon: #d4a017;
      --format-bg: #e8e8e8;
      --format-hover: #d8d8d8;
      --format-border: #d0d0d0;
      --format-active-bg: #0366d6;
      --format-active-border: #0052b3;
      --format-active-text: #ffffff;
      --heading-accent: #0366d6;
      --color-panel-bg: #ffffff;
      --color-panel-border: #d0d0d0;
      --color-panel-title: #6a737d;
      --color-panel-label: #6a737d;
      --modal-overlay: rgba(0, 0, 0, 0.4);
      --toast-border: #555555;
      --table-border: #dfe2e5;
      --pre-bg: #f6f8fa;
      --pre-border: #e1e4e8;
      --hr-color: #e1e4e8;
      --blockquote-border: #dfe2e5;
      --blockquote-text: #6a737d;
      --img-border: #e1e4e8;
      --img-bg: #f6f8fa;
      --img-error-bg: #ffeef0;
      --img-error-border: #d73a49;
      --mark-bg: #fff5b1;
      --mark-text: #24292e;
      --placeholder: #8a8a8a;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    .topbar {
      height: 38px;
      min-height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background-color: var(--bg-topbar);
      border-bottom: 1px solid var(--border-main);
      font-size: 13px;
      color: var(--text-dim);
      position: relative;
      z-index: 100;
    }

    .topbar .left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .topbar .brand svg {
      width: 16px;
      height: 16px;
      fill: var(--brand-icon);
    }

    .topbar .top-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-btn);
      color: var(--text-main);
      border: 1px solid var(--border-input);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover {
      background-color: var(--bg-btn-hover);
      border-color: var(--border-hover);
    }

    .btn:active {
      background-color: var(--bg-btn-active);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      opacity: 0.9;
    }

    .main-area {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.15s, min-width 0.15s;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      border-right: none;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-main);
      font-size: 12px;
      color: var(--text-dim);
      flex-shrink: 0;
      user-select: none;
    }

    .sidebar-header .folder-name {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-header .folder-name svg {
      width: 14px;
      height: 14px;
      fill: var(--folder-icon);
      flex-shrink: 0;
    }

    .sidebar-header .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      display: flex;
      align-items: center;
      border-radius: 3px;
    }

    .sidebar-header .close-btn:hover {
      background-color: var(--bg-btn);
      color: var(--text-bright);
    }

    .sidebar-header .close-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .file-list {
      list-style: none;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 12.5px;
      color: var(--text-dim);
      border-left: 2px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item:hover {
      background-color: var(--bg-sidebar-hover);
    }

    .file-item.active {
      background-color: var(--bg-sidebar-active);
      color: var(--text-bright);
      border-left-color: var(--accent);
    }

    .file-item svg {
      width: 13px;
      height: 13px;
      fill: var(--svg-icon);
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 6px 10px;
      border-top: 1px solid var(--border-main);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-empty {
      padding: 20px 12px;
      color: var(--text-faint);
      font-size: 12px;
      text-align: center;
      font-style: italic;
    }

    .editor-container {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .editor-container.horizontal {
      flex-direction: row;
    }

    .editor-container.vertical {
      flex-direction: column;
    }

    .source-panel,
    .preview-panel {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .panel-fixed {
      flex-shrink: 0;
    }

    .panel-flex {
      flex: 1;
    }

    .divider {
      background-color: var(--bg-divider);
      flex-shrink: 0;
      position: relative;
      transition: background-color 0.15s;
      touch-action: none;
      user-select: none;
      z-index: 10;
    }

    .editor-container.horizontal .divider {
      width: 6px;
      cursor: col-resize;
    }

    .editor-container.vertical .divider {
      height: 6px;
      cursor: row-resize;
    }

    .divider:hover,
    .divider.active {
      background-color: var(--accent);
    }

    .divider::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background-color: var(--text-faint);
      border-radius: 2px;
      pointer-events: none;
    }

    .editor-container.horizontal .divider::after {
      width: 2px;
      height: 40px;
    }

    .editor-container.vertical .divider::after {
      width: 40px;
      height: 2px;
    }

    .divider:hover::after,
    .divider.active::after {
      background-color: var(--accent-hover);
    }

    @media (max-width: 768px) {
      .editor-container.horizontal .divider {
        width: 10px;
      }

      .editor-container.vertical .divider {
        height: 10px;
      }
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background-color: var(--bg-panel-header);
      border-bottom: 1px solid var(--border-main);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      user-select: none;
      flex-shrink: 0;
      min-height: 35px;
    }

    .panel-header .title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .panel-header .title .file-name {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .panel-header svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .panel-header .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .format-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border-input);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .format-toggle-btn:hover {
      background-color: var(--bg-btn);
    }

    .format-toggle-btn.active {
      background-color: var(--format-active-bg);
      border-color: var(--format-active-border);
      color: var(--format-active-text);
    }

    .format-toolbar {
      display: none;
      flex-wrap: wrap;
      gap: 3px;
      padding: 6px 8px;
      background-color: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-main);
      flex-shrink: 0;
    }

    .format-toolbar.show {
      display: flex;
    }

    .format-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 28px;
      padding: 0 6px;
      background-color: var(--format-bg);
      color: var(--text-main);
      border: 1px solid var(--format-border);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, border-color 0.15s;
      position: relative;
    }

    .format-btn:hover {
      background-color: var(--format-hover);
      border-color: var(--border-hover);
    }

    .format-btn:active {
      background-color: var(--bg-btn-active);
    }

    .format-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .format-btn.text-icon {
      font-weight: 600;
    }

    .format-btn.italic-icon {
      font-style: italic;
      font-family: Georgia, serif;
    }

    .format-btn.strike-icon {
      text-decoration: line-through;
    }

    .format-btn.sep {
      min-width: 1px;
      width: 1px;
      height: 20px;
      background: var(--border-input);
      border: none;
      padding: 0;
      margin: 4px 3px;
      cursor: default;
    }

    .format-btn.sep:hover {
      background: var(--border-input);
    }

    .heading-dropdown-wrap {
      position: relative;
    }

    .heading-dropdown {
      position: absolute;
      top: 32px;
      left: 0;
      background-color: var(--bg-dropdown);
      border: 1px solid var(--border-dropdown);
      border-radius: 6px;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      display: none;
      flex-direction: column;
      gap: 1px;
      z-index: 300;
      min-width: 130px;
    }

    .heading-dropdown.open {
      display: flex;
    }

    .heading-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text-main);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }

    .heading-item:hover {
      background-color: var(--bg-sidebar-active);
    }

    .heading-item .h-num {
      color: var(--heading-accent);
      font-weight: 600;
      font-family: monospace;
      min-width: 28px;
    }

    .color-panel {
      position: absolute;
      top: 32px;
      left: 0;
      background-color: var(--color-panel-bg);
      border: 1px solid var(--color-panel-border);
      border-radius: 6px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      display: none;
      z-index: 300;
      width: 200px;
    }

    .color-panel.open {
      display: block;
    }

    .color-panel .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .color-swatch {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.1s, transform 0.1s;
    }

    .color-swatch:hover {
      border-color: var(--accent);
      transform: scale(1.08);
    }

    .color-panel .custom-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-main);
    }

    .color-panel .custom-row label {
      font-size: 12px;
      color: var(--color-panel-label);
      flex: 1;
    }

    .color-panel input[type="color"] {
      width: 40px;
      height: 28px;
      border: 1px solid var(--border-input);
      border-radius: 4px;
      background-color: transparent;
      cursor: pointer;
      padding: 1px;
    }

    .color-panel .panel-title {
      font-size: 11px;
      color: var(--color-panel-title);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #markdown-input {
      flex: 1;
      width: 100%;
      padding: 20px;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: none;
      outline: none;
      resize: none;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
      font-size: 15px;
      line-height: 1.6;
      tab-size: 4;
      overflow-y: auto;
      caret-color: var(--accent);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    #markdown-input.nowrap {
      white-space: pre;
      overflow-x: auto;
      word-break: normal;
    }

    #markdown-input.wrap {
      white-space: pre-wrap;
      word-break: break-word;
    }

    #markdown-input::-webkit-scrollbar,
    .preview-content::-webkit-scrollbar,
    .sidebar-body::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    #markdown-input::-webkit-scrollbar-track,
    .preview-content::-webkit-scrollbar-track,
    .sidebar-body::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }

    #markdown-input::-webkit-scrollbar-thumb,
    .preview-content::-webkit-scrollbar-thumb,
    .sidebar-body::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 5px;
    }

    #markdown-input::-webkit-scrollbar-thumb:hover,
    .preview-content::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    .preview-content {
      flex: 1;
      padding: 20px 25px 120px 25px;
      overflow-y: auto;
      overflow-x: auto;
      background-color: var(--bg-preview);
      color: var(--text-main);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .markdown-body {
      background-color: transparent !important;
      color: var(--text-main) !important;
      font-size: 15px;
      line-height: 1.7;
      max-width: 100%;
    }

    .markdown-body.wrap-mode {
      word-wrap: break-word;
      word-break: break-word;
    }

    .markdown-body.nowrap-mode {
      word-wrap: normal;
      word-break: normal;
    }

    .markdown-body.nowrap-mode p,
    .markdown-body.nowrap-mode li,
    .markdown-body.nowrap-mode td,
    .markdown-body.nowrap-mode th {
      white-space: nowrap;
    }

    .markdown-body.nowrap-mode pre {
      white-space: pre;
    }

    .markdown-body.wrap-mode pre {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .markdown-body pre {
      background-color: var(--pre-bg) !important;
      border-radius: 6px;
      padding: 16px !important;
      overflow-x: auto;
      border: 1px solid var(--pre-border);
    }

    .markdown-body code {
      background-color: var(--bg-code) !important;
      color: var(--text-main) !important;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    .markdown-body pre code {
      background-color: transparent !important;
      padding: 0 !important;
      font-size: 0.9em;
      line-height: 1.5;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: var(--text-bright);
      border-bottom-color: var(--border-main);
    }

    .markdown-body a {
      color: var(--text-link);
    }

    .markdown-body blockquote {
      border-left-color: var(--blockquote-border);
      color: var(--blockquote-text);
    }

    .markdown-body table th,
    .markdown-body table td {
      border-color: var(--table-border);
    }

    .markdown-body table tr {
      background-color: transparent;
      border-top-color: var(--table-border);
    }

    .markdown-body table tr:nth-child(2n) {
      background-color: var(--bg-table-nth);
    }

    .markdown-body hr {
      background-color: var(--hr-color);
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 12px 0;
      border-radius: 6px;
      border: 1px solid var(--img-border);
      background-color: var(--img-bg);
    }

    .markdown-body img.img-error {
      border: 1px dashed var(--img-error-border);
      padding: 20px;
      min-height: 60px;
      background-color: var(--img-error-bg);
    }

    .markdown-body mark {
      background-color: var(--mark-bg);
      color: var(--mark-text);
      padding: 0.1em 0.3em;
      border-radius: 3px;
    }

    ::selection {
      background-color: var(--selection);
      color: var(--selection-text);
    }

    .placeholder-hint {
      color: var(--placeholder);
      font-style: italic;
    }

    body.resizing {
      user-select: none;
    }

    body.resizing * {
      user-select: none !important;
    }

    .editor-container.horizontal.resizing {
      cursor: col-resize;
    }

    .editor-container.vertical.resizing {
      cursor: row-resize;
    }

    .dropdown {
      position: absolute;
      top: 42px;
      background-color: var(--bg-dropdown);
      border: 1px solid var(--border-dropdown);
      border-radius: 6px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 200;
      min-width: 200px;
    }

    .dropdown.open {
      display: flex;
    }

    .dropdown.right {
      right: 12px;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      font-size: 13px;
      color: var(--text-main);
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }

    .dropdown-item:hover {
      background-color: var(--bg-sidebar-active);
    }

    .dropdown-item:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dropdown-item:disabled:hover {
      background-color: transparent;
    }

    .dropdown-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.8;
      flex-shrink: 0;
    }

    .dropdown-item .label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .dropdown-item .check {
      opacity: 0.9;
      color: var(--success);
      font-weight: 700;
      margin-left: auto;
    }

    .dropdown-divider {
      height: 1px;
      background-color: var(--border-main);
      margin: 4px 2px;
    }

    @media (max-width: 600px) {
      .preview-content {
        padding-bottom: 160px;
      }

      .topbar .brand span {
        display: none;
      }

      .btn .btn-label {
        display: none;
      }

      .btn {
        padding: 5px 8px;
      }

      .sidebar {
        width: 180px;
      }

      .dropdown {
        min-width: 180px;
      }

      .format-btn {
        min-width: 32px;
        height: 30px;
      }

      .color-panel {
        width: 180px;
      }

      .color-swatch {
        width: 26px;
        height: 26px;
      }
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--modal-overlay);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background-color: var(--bg-modal);
      border: 1px solid var(--border-dropdown);
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .modal h3 {
      font-size: 15px;
      color: var(--text-bright);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .modal label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }

    .modal input[type="text"] {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-input);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .modal input[type="text"]:focus {
      border-color: var(--accent);
    }

    .modal .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .modal .modal-actions button {
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      border: 1px solid var(--border-input);
      background-color: var(--bg-btn);
      color: var(--text-main);
    }

    .modal .modal-actions button:hover {
      background-color: var(--bg-btn-hover);
    }

    .modal .modal-actions button.primary {
      background-color: var(--accent);
      border-color: var(--accent-border);
      color: #ffffff;
    }

    .modal .modal-actions button.primary:hover {
      background-color: var(--accent-hover);
    }

    /* 通知 toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      /* 👇 這裡改成固定的深色背景和淺色文字，不管主題是什麼都看得清楚 */
      background-color: #333333;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #555555;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      max-width: 80vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    .toast.success {
      border-color: #4ec9b0;
    }

    .toast.error {
      border-color: #f48771;
    }

    /* 👇 如果之後想讓淺色模式的 toast 變成「白底黑字」，可以在下面加上這段（可選） */
    body.theme-light .toast {
      background-color: #ffffff;
      color: #24292e;
      border: 1px solid #d0d0d0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .progress-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-progress);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      flex-direction: column;
      gap: 16px;
    }

    .progress-overlay.show {
      display: flex;
    }

    .progress-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(86, 156, 214, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .progress-text {
      color: var(--text-main);
      font-size: 14px;
      text-align: center;
      max-width: 80vw;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printArea,
      #printArea * {
        visibility: visible;
      }

      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 20px;
      }

      #printArea * {
        color: #000000 !important;
        border-color: #cccccc !important;
      }

      #printArea pre {
        background: #f5f5f5 !important;
      }

      #printArea code {
        background: #f5f5f5 !important;
        color: #000000 !important;
      }
    }

    #printArea {
      display: none;
    }
  </style>
</head>

  <script>
    (function () {
      const input = document.getElementById('markdown-input');
      const preview = document.getElementById('preview');
      const importBtn = document.getElementById('import-btn');
      const fileInput = document.getElementById('file-input');
      const imageInput = document.getElementById('image-input');
      const folderInput = document.getElementById('folder-input');
      const container = document.getElementById('editorContainer');
      const sourcePanel = document.getElementById('sourcePanel');
      const previewPanel = document.getElementById('previewPanel');
      const divider = document.getElementById('divider');

      const openFolderBtn = document.getElementById('open-folder-btn');
      const openFilesBtn = document.getElementById('open-files-btn');
      const saveBtn = document.getElementById('save-btn');
      const sidebar = document.getElementById('sidebar');
      const sidebarBody = document.getElementById('sidebarBody');
      const sidebarFooter = document.getElementById('sidebarFooter');
      const folderNameText = document.getElementById('folderNameText');

      const toggleSidebarTopBtn = document.getElementById('toggle-sidebar-top-btn');

      const fileMenuBtn = document.getElementById('file-menu-btn');
      const fileMenu = document.getElementById('fileMenu');

      const exportMenuBtn = document.getElementById('export-menu-btn');

      const exportMdBtn = document.getElementById('export-md-btn');
